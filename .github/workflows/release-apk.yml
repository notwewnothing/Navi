name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the build (e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # The release build is signed with the debug config, so restoring a fixed
      # keystore here keeps the signature stable. Without the secret Gradle
      # generates a throwaway key and upgrades over an older APK fail.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using keystore from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; Gradle will generate a debug key."
          fi

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            name="${{ inputs.version }}"
          else
            name="$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/navi-${{ steps.version.outputs.name }}.apk

      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')"
            mv "$apk" \
               "build/app/outputs/flutter-apk/navi-${{ steps.version.outputs.name }}-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: navi-apk-${{ steps.version.outputs.name }}
          path: build/app/outputs/flutter-apk/navi-*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          name: NAVI ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/navi-*.apk

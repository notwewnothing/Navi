name: navi
description: "NAVI — habits, journal, schedule. Present day, present time."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  app_usage: ^4.1.0
  android_intent_plus: ^6.0.0
  vibration: ^3.2.0
  image_picker: ^1.2.1
  record: ^6.1.2
  audioplayers: ^6.5.1
  video_player: ^2.10.0
  path_provider: ^2.1.5

# path_provider_android >=2.3.0 pulls the jni package, whose android
# build.gradle uses the legacy kotlin() DSL and fails under this Gradle.
dependency_overrides:
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#020402"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    # Nothing's dot-matrix display face. Body copy uses the system grotesque.
    - family: Ndot
      fonts:
        - asset: assets/fonts/NOTHING.otf.ttf
    - family: PixelDisplay
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Terminal
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
